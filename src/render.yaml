# Render deployment settings.
# Render reads this file automatically - you should not need to edit it.

services:
  - type: web
    name: dip-screener
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    # One worker only. More workers would mean several copies of the
    # refresh loop all fetching prices at the same time.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app

    # Render pings this to confirm the app started. It answers instantly
    # instead of waiting for a price scan to finish.
    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Without this, Python holds log lines in a buffer and Render's
      # Logs tab stays empty even though the app is printing.
      - key: PYTHONUNBUFFERED
        value: "1"
      # Render prompts you for these and stores them securely.
      # They never appear in your GitHub repository.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
